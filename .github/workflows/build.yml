name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # tag push'ta release'e asset eklemek için

jobs:
  lint:
    name: Lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Run pyflakes
        run: python -m pyflakes app.py test_chrome_e2e.py test_chrome_clipboard.py
      - name: Syntax check (py_compile)
        run: python -m py_compile app.py test_chrome_e2e.py test_chrome_clipboard.py

  build:
    name: Build (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: kopyala-yapistir-macos-arm64
            binary_glob: dist/secili-metin-kaydedici
            zip_cmd: zip -r
          - os: macos-13
            artifact_name: kopyala-yapistir-macos-x86_64
            binary_glob: dist/secili-metin-kaydedici
            zip_cmd: zip -r
          - os: ubuntu-latest
            artifact_name: kopyala-yapistir-linux-x86_64
            binary_glob: dist/secili-metin-kaydedici
            zip_cmd: zip -r
          - os: windows-latest
            artifact_name: kopyala-yapistir-windows-x86_64
            binary_glob: dist/secili-metin-kaydedici.exe
            zip_cmd: 7z a

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Linux system deps (xvfb for headless pynput)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build binary (Linux, with xvfb)
        # pynput import-zamanında X server'a bağlanır. PyInstaller hook
        # da build sırasında pynput'u import etmek zorunda — DISPLAY yoksa
        # bundle eksik kalır. xvfb-run ile sahte X server sağlıyoruz.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x build.sh
          xvfb-run --auto-servernum ./build.sh

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --name secili-metin-kaydedici --console --noconfirm --clean app.py
          Get-Item dist\secili-metin-kaydedici.exe | Format-List Name,Length

      - name: Verify binary runs (Linux, with xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum ./dist/secili-metin-kaydedici --help

      - name: Verify binary runs (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./dist/secili-metin-kaydedici --help

      - name: Verify binary runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: ./dist/secili-metin-kaydedici.exe --help

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PKG="${{ matrix.artifact_name }}"
          mkdir -p "release/$PKG"
          cp dist/secili-metin-kaydedici "release/$PKG/"
          if [ -f dist/Calistir.command ]; then
            cp dist/Calistir.command "release/$PKG/"
          fi
          cp README.md LICENSE "release/$PKG/"
          cd release && zip -r "../$PKG.zip" "$PKG"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path "release\$pkg" | Out-Null
          Copy-Item dist\secili-metin-kaydedici.exe "release\$pkg\"
          Copy-Item README.md, LICENSE "release\$pkg\"
          Compress-Archive -Path "release\$pkg" -DestinationPath "$pkg.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
          fail_on_unmatched_files: true
